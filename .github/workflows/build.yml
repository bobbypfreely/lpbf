name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No gradle-wrapper.jar is committed to this repo, so we provision
      # Gradle directly here and invoke `gradle` (not `./gradlew`) below.
      # Once a wrapper jar is added later, this can switch back to ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: gradle assembleDebug

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: gradle assembleRelease

      - name: Locate built APK(s)
        run: find app/build/outputs/apk -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpbf-${{ github.event.inputs.build_type }}-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
